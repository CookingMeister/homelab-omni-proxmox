---
# Pool of LAN addresses Cilium hands out to type=LoadBalancer services.
# 192.168.0.15-34 is reserved outside the router's DHCP range.
# Cluster nodes live at .77, .224 and .246, well clear of this block.
#
# Allocation (pin an address with the annotation
# `io.cilium/lb-ipam-ips: "192.168.0.x"` on the Service):
#   .15  homepage
#   .16  hubble-ui
#   .17-.34  unallocated
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-pool
spec:
  blocks:
    - start: "192.168.0.15"
      stop: "192.168.0.34"
---
# Which nodes answer ARP for those addresses. Every node participates; Cilium
# elects a single announcing node per service and fails over automatically.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-policy
spec:
  # Only the real LAN NIC. Must not match Omni's `siderolink` WireGuard
  # interface, or ARP would be announced into the management tunnel.
  interfaces:
    - ^eth[0-9]+$
  externalIPs: true
  loadBalancerIPs: true
