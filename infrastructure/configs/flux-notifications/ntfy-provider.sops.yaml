# ntfy.sh topic Flux posts to. On the public ntfy.sh server a topic name is
# the only access control - anyone who knows it can read and publish - so it
# is SOPS-encrypted here. Subscribe to it in the ntfy app; read it with:
#   sops -d infrastructure/configs/flux-notifications/ntfy-provider.sops.yaml
#
# Flux has no ntfy provider, so the "generic" provider POSTs its raw JSON
# event and ntfy's templating turns it into a readable notification.
# The headers key is YAML, parsed by the notification-controller.
apiVersion: v1
kind: Secret
metadata:
    name: ntfy-provider
    namespace: flux-system
type: Opaque
stringData:
