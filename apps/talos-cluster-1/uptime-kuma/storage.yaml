---
# TrueNAS-backed replacements for the local-path volumes. Unlike local-path,
# these are not tied to a node, so a node rebuild or rename no longer strands
# the data (which is exactly how this app lost its database on 2026-09-19).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime-kuma
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autokuma-state
  namespace: uptime-kuma
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    # AutoKuma only stores its "which monitor is mine" map here, but the
    # zvol blocksize makes anything under 1Gi pointless.
    requests:
      storage: 1Gi
