---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  interval: 1h
  chart:
    spec:
      chart: uptime-kuma
      version: "4.2.0"
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
        namespace: uptime-kuma
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart lags the application — chart 4.2.0 (August) still ships Uptime
    # Kuma 2.5.0 while upstream is on 2.5.x patch releases, one of which fixes
    # a security issue — so the image tag is pinned here rather than inherited
    # from the chart's appVersion. Renovate tracks this line via the
    # customManager in renovate.json; it cannot see a chart's appVersion.
    image:
      # renovate: image=louislam/uptime-kuma
      tag: "2.5.11"

    podEnv:
      - name: TZ
        value: America/Halifax

    volume:
      enabled: true
      # TrueNAS iSCSI volume defined in storage.yaml, holding Uptime Kuma's
      # SQLite database (monitors, history, users). Declared there rather than
      # generated by the chart so it survives a HelmRelease reinstall, and so
      # it is not tied to one node the way the old local-path volume was.
      existingClaim: uptime-kuma-data

    # SQLite on a RWO volume cannot be opened by two pods at once, so the old
    # pod must stop before the new one starts.
    strategy:
      type: Recreate

    service:
      # Cilium L2 announcements hand out this address from lan-pool
      # (infrastructure/configs/cilium-l2.yaml). Pinned so the Traefik LXC
      # backend address stays stable across redeploys.
      # Public name: uptimecluster.home.fullstackchef.dev. Traefik must pass
      # WebSocket upgrades through; the UI is a single socket.io connection.
      type: LoadBalancer
      port: 3001
      annotations:
        io.cilium/lb-ipam-ips: "192.168.0.18"

    # Nodes under-report memory to the scheduler because of Proxmox ballooning,
    # so requests are declared rather than left to whatever looks free.
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 768Mi
