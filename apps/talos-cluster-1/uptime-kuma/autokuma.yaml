---
# AutoKuma keeps Uptime Kuma's monitors in step with the JSON files in
# ./monitors, so the monitor list lives in Git rather than only in the UI's
# SQLite database. Every monitor it creates carries an "AutoKuma" tag;
# monitors without that tag (clicked together in the UI) are left alone.
# Removing a file deletes its monitor after a 60s grace period.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autokuma-data
  namespace: uptime-kuma
spec:
  # AutoKuma's own map of AutoKuma ID -> Uptime Kuma monitor ID. Losing it
  # makes AutoKuma forget which monitors it owns, so it is persisted.
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autokuma
  namespace: uptime-kuma
spec:
  replicas: 1
  # The sled database in /data is single-writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: autokuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autokuma
    spec:
      containers:
        - name: autokuma
          image: ghcr.io/bigboot/autokuma:2.0.0
          env:
            - name: AUTOKUMA__KUMA__URL
              value: http://uptime-kuma.uptime-kuma.svc.cluster.local:3001
            # Must match the admin account created in the Uptime Kuma setup
            # wizard. Until that account exists AutoKuma just logs login
            # failures and retries.
            - name: AUTOKUMA__KUMA__USERNAME
              valueFrom:
                secretKeyRef:
                  name: autokuma-credentials
                  key: username
            - name: AUTOKUMA__KUMA__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autokuma-credentials
                  key: password
            - name: AUTOKUMA__STATIC_MONITORS
              value: /monitors
            # ConfigMap volumes are made of symlinks into a hidden ..data
            # directory; without this AutoKuma sees an empty folder. Hidden
            # entries are skipped, so files are not picked up twice.
            - name: AUTOKUMA__FILES__FOLLOW_SYMLINKS
              value: "true"
            - name: AUTOKUMA__DATA_PATH
              value: /data
            # Only the files source is used. The Docker source has no socket
            # here, and the Kubernetes source is unmaintained upstream.
            - name: AUTOKUMA__DOCKER__ENABLED
              value: "false"
            - name: AUTOKUMA__KUBERNETES__ENABLED
              value: "false"
          volumeMounts:
            - name: monitors
              mountPath: /monitors
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        # Generated by kustomization.yaml from ./monitors. The name gets a
        # content hash, so editing a monitor file rolls this pod.
        - name: monitors
          configMap:
            name: autokuma-monitors
        - name: data
          persistentVolumeClaim:
            claimName: autokuma-data
