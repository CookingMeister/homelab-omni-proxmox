---
# TrueNAS-backed volume for linkding's SQLite database and uploaded assets.
# Declared here rather than generated by the chart so that a HelmRelease
# reinstall cannot take the bookmarks with it, and so the pod is not pinned
# to whichever node a local-path directory happened to land on.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkding-data
  namespace: linkding
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
