---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: jameswynn
        namespace: homepage
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # RBAC + a service account are required for the Kubernetes widgets and for
    # auto-discovery of annotated services.
    enableRbac: true
    serviceAccount:
      create: true

    env:
      TZ: Europe/Berlin
      # Homepage v1.x refuses requests whose Host header is not listed here.
      # Add the LoadBalancer IP or DNS name once you expose it, comma separated.
      HOMEPAGE_ALLOWED_HOSTS: "localhost:3000,homepage.homepage.svc.cluster.local:3000"

    service:
      main:
        # Switch to LoadBalancer once the Cilium L2 IP pool in
        # infrastructure/configs/cilium-l2.yaml is filled in and enabled.
        type: ClusterIP
        ports:
          http:
            port: 3000

    config:
      kubernetes:
        mode: cluster

      settingsString: |
        title: Talos Homelab
        headerStyle: boxed
        layout:
          Cluster:
            style: row
            columns: 3
          Infrastructure:
            style: row
            columns: 3

      widgets:
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: talos-cluster-1
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - search:
            provider: duckduckgo
            target: _blank

      services:
        - Cluster:
            - Hubble UI:
                href: http://hubble-ui.kube-system.svc.cluster.local
                description: Cilium eBPF network observability
            - Omni:
                href: https://omni.fullstackchef.dev
                description: Sidero Omni - Talos cluster management
            - Proxmox:
                href: https://192.168.0.1:8006
                description: Hypervisor (update to your Proxmox address)

        - Infrastructure:
            - Cilium:
                description: CNI, kube-proxy replacement, L2 announcements
            - Flux:
                description: GitOps reconciliation
            - Metrics Server:
                description: Resource metrics for kubectl top and Homepage widgets

      bookmarks:
        - Documentation:
            - Talos:
                - abbr: TL
                  href: https://www.talos.dev/latest/
            - Cilium:
                - abbr: CI
                  href: https://docs.cilium.io/
            - Flux:
                - abbr: FL
                  href: https://fluxcd.io/flux/
