---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: jameswynn
        namespace: homepage
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart lags the application badly — chart 2.1.0 still ships Homepage
    # v1.2.0 while upstream is on v2.x — so the image tag is pinned here rather
    # than inherited from the chart's appVersion. Renovate tracks this line via
    # the customManager in renovate.json; it cannot see a chart's appVersion.
    image:
      # renovate: image=ghcr.io/gethomepage/homepage
      tag: v2.1.2

    # RBAC + a service account are required for the Kubernetes widgets.
    enableRbac: true
    serviceAccount:
      create: true

    env:
      TZ: America/Halifax
      # Homepage rejects any request whose Host header is not listed here, and
      # Traefik forwards the original Host, so the public name must be present.
      # This is the CLUSTER dashboard: homepage.home.fullstackchef.dev belongs to
      # a separate, pre-existing Homepage and must not be listed here.
      HOMEPAGE_ALLOWED_HOSTS: "k8s.home.fullstackchef.dev,192.168.0.15:3000,localhost:3000"

    service:
      main:
        # Cilium L2 announcements hand out this address from lan-pool
        # (infrastructure/configs/cilium-l2.yaml). Pinned so the Traefik LXC
        # backend address stays stable across redeploys.
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "192.168.0.15"
        ports:
          http:
            port: 3000

    config:
      kubernetes:
        mode: cluster

      settingsString: |
        title: Talos Homelab
        headerStyle: boxed
        layout:
          Cluster:
            style: row
            columns: 3
          Infrastructure:
            style: row
            columns: 3
          Storage:
            style: row
            columns: 3

      widgets:
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: talos-cluster-1
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - search:
            provider: duckduckgo
            target: _blank

      # Homepage's Kubernetes discovery reads Ingress, Traefik IngressRoute and
      # Gateway API HTTPRoute objects — not Services. Traefik runs outside this
      # cluster and nothing here creates those objects, so the dashboard is
      # defined here in Git instead.
      services:
        - Cluster:
            - Hubble UI:
                href: http://192.168.0.16
                description: eBPF network observability
                icon: cilium.png

        - Infrastructure:
            # Bare *.png names resolve against the dashboard-icons CDN, so the
            # name must exist there — an unknown name renders as a broken image.
            # There is no sidero/omni icon; talos.png is the closest match.
            - Omni:
                href: https://omni.fullstackchef.dev
                description: Talos machine management
                icon: talos.png
            - Proxmox:
                href: https://proxmox.home.fullstackchef.dev/
                description: Hypervisor
                icon: proxmox.png

        - Storage:
            - Proxmox NAS:
                href: https://proxmox-nas.home.fullstackchef.dev/
                description: Hypervisor hosting the NAS
                icon: proxmox.png
            - TrueNAS:
                href: https://truenas.home.fullstackchef.dev/
                description: TrueNAS Scale
                icon: truenas.png

      bookmarks:
        - Documentation:
            - Talos:
                - abbr: TL
                  href: https://www.talos.dev/latest/
            - Cilium:
                - abbr: CI
                  href: https://docs.cilium.io/
            - Flux:
                - abbr: FL
                  href: https://fluxcd.io/flux/
