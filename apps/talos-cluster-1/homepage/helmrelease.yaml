---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: jameswynn
        namespace: homepage
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # RBAC + a service account are required for the Kubernetes widgets and for
    # auto-discovery of annotated services.
    enableRbac: true
    serviceAccount:
      create: true

    # The chart's ClusterRole covers ingresses but NOT services. Traefik runs
    # outside the cluster, so there are no Ingress objects here and discovery has
    # to read Services instead — without this, annotated services never appear.
    extraClusterRoles:
      - apiGroups:
          - ""
        resources:
          - services
        verbs:
          - get
          - list

    env:
      TZ: America/Halifax
      # Homepage v1.x rejects any request whose Host header is not listed here.
      # Traefik forwards the original Host, so the public name must be present.
      # Adjust the hostname if you publish Homepage under a different record.
      HOMEPAGE_ALLOWED_HOSTS: "home.fullstackchef.dev,homepage.home.fullstackchef.dev,192.168.0.15:3000,localhost:3000"

    service:
      main:
        # Cilium L2 announcements hand out this address from lan-pool
        # (infrastructure/configs/cilium-l2.yaml). Pinned so the Traefik LXC
        # backend address stays stable across redeploys.
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "192.168.0.15"
        ports:
          http:
            port: 3000

    config:
      kubernetes:
        mode: cluster

      settingsString: |
        title: Talos Homelab
        headerStyle: boxed
        layout:
          Cluster:
            style: row
            columns: 3
          Infrastructure:
            style: row
            columns: 3

      widgets:
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: talos-cluster-1
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - search:
            provider: duckduckgo
            target: _blank

      # The "Cluster" group is populated automatically from Services carrying
      # gethomepage.dev/* annotations — see the README. Only things that live
      # outside the cluster are listed statically here.
      services:
        - Infrastructure:
            - Omni:
                href: https://omni.fullstackchef.dev
                description: Talos machine management
                icon: sidero.png
            - Proxmox:
                href: https://192.168.0.1:8006
                description: Hypervisor — replace with your Proxmox address
                icon: proxmox.png

      bookmarks:
        - Documentation:
            - Talos:
                - abbr: TL
                  href: https://www.talos.dev/latest/
            - Cilium:
                - abbr: CI
                  href: https://docs.cilium.io/
            - Flux:
                - abbr: FL
                  href: https://fluxcd.io/flux/
