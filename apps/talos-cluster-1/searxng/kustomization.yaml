---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.sops.yaml
  - deployment.yaml
configMapGenerator:
  # Hash-suffixed name, so editing settings.yml rolls the pod.
  - name: searxng-settings
    namespace: searxng
    files:
      - settings.yml
